version: "3.9"

services:
  kafka-01:
    environment:
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka-01:9093,2@kafka-02:9093,3@kafka-03:9093
    deploy:
      placement:
        constraints:
          - "node.labels.name==${KAFKA_01_PLACEMENT}"
    healthcheck:
      test: ["CMD-SHELL", "df bitnami/kafka -h | tail -n 1 | awk '{print $$5}' | cut -d'%' -f1 | awk '{exit ($$1 > ${KAFKA_01_DISK_USAGE_THRESHOLD})}'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  kafka-02:
    image: ${KAFKA_IMAGE}
    hostname: "{{.Node.Hostname}}-{{.Service.Name}}"
    environment:
      BITNAMI_DEBUG: ${KAFKA_DEBUG}
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_KRAFT_CLUSTER_ID: "ehB92ChxEe2iYQAAAkKsEg"
      KAFKA_CFG_NODE_ID: 2
      KAFKA_CFG_BROKER_ID: 2
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka-02:9092
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka-01:9093,2@kafka-02:9093,3@kafka-03:9093
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka-02-data:/bitnami/kafka
    deploy:
      placement:
        constraints:
          - "node.labels.name==${KAFKA_02_PLACEMENT}"
      replicas: ${KAFKA_REPLICAS}
      resources:
        limits:
          memory: ${KAFKA_MEMORY_LIMIT}
        reservations:
          memory: ${KAFKA_MEMORY_RESERVE}
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD-SHELL", "df bitnami/kafka -h | tail -n 1 | awk '{print $$5}' | cut -d'%' -f1 | awk '{exit ($$1 > ${KAFKA_02_DISK_USAGE_THRESHOLD})}'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      public:
      default:

  kafka-03:
    image: ${KAFKA_IMAGE}
    hostname: "{{.Node.Hostname}}-{{.Service.Name}}"
    environment:
      BITNAMI_DEBUG: ${KAFKA_DEBUG}
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_KRAFT_CLUSTER_ID: "ehB92ChxEe2iYQAAAkKsEg"
      KAFKA_CFG_NODE_ID: 3
      KAFKA_CFG_BROKER_ID: 3
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka-03:9092
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka-01:9093,2@kafka-02:9093,3@kafka-03:9093
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka-03-data:/bitnami/kafka
    deploy:
      placement:
        constraints:
          - "node.labels.name==${KAFKA_03_PLACEMENT}"
      replicas: ${KAFKA_REPLICAS}
      resources:
        limits:
          memory: ${KAFKA_MEMORY_LIMIT}
        reservations:
          memory: ${KAFKA_MEMORY_RESERVE}
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD-SHELL", "df bitnami/kafka -h | tail -n 1 | awk '{print $$5}' | cut -d'%' -f1 | awk '{exit ($$1 > ${KAFKA_03_DISK_USAGE_THRESHOLD})}'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      public:
      default:

volumes:
  kafka-02-data:
  kafka-03-data:
